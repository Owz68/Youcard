<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>YouCard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#F2EFE6;--sf:#fff;--tx:#1B2421;--mu:#51615B;--bd:#dcd8cc;--gr:#1A7A5B;--bt:#0B3D35;--bf:#F2EFE6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1512;--sf:#13231e;--tx:#F2EFE6;--mu:#9fb0a9;--bd:#264038;--gr:#3DDC97;--bt:#3DDC97;--bf:#0B3D35}}
:root[data-theme=dark]{--bg:#0b1512;--sf:#13231e;--tx:#F2EFE6;--mu:#9fb0a9;--bd:#264038;--gr:#3DDC97;--bt:#3DDC97;--bf:#0B3D35}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,.lg{font-family:Manrope,Inter,sans-serif;margin:.5em 0}.lg{font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px}.lg b{color:var(--gr)}.lgo{background:#fff;border-radius:12px;padding:6px 14px;max-width:100%;height:auto}
.wrap{max-width:980px;margin:auto;padding:14px}.box{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:10px 0}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0}nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:20px;padding:7px 14px;font:inherit;cursor:pointer}nav button.on{background:var(--bt);color:var(--bf);border-color:var(--bt)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx);font:inherit;margin:4px 0}input[type=checkbox]{width:auto}input[type=color]{height:42px;padding:3px}
label{display:block;font-size:13px;color:var(--mu);margin-top:6px}
.btn{background:var(--bt);color:var(--bf);border:0;border-radius:12px;padding:10px 16px;font:600 14px Inter;cursor:pointer;margin:3px 3px 3px 0}.btn.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.r{color:#c0392b}
.g{display:grid;gap:10px}.g4{grid-template-columns:repeat(2,1fr)}.st{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;color:var(--mu)}.st b{display:block;font:800 28px Manrope;color:var(--tx)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}.mu{color:var(--mu);font-size:13px}.lk{color:var(--gr);cursor:pointer;text-decoration:underline}
.card{background:var(--cbg);color:var(--cfg);border-radius:24px;padding:22px;box-shadow:0 18px 40px -18px rgba(0,0,0,.55);max-width:420px;margin:12px auto}
.card h2{margin:10px 0 0;font-size:24px}.card .ro{color:var(--cac);font-weight:600}.av{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--cac);background:rgba(127,127,127,.2)}
.cb{display:block;background:rgba(127,127,127,.16);color:inherit;border:1px solid rgba(127,127,127,.3);border-radius:12px;padding:11px 14px;text-decoration:none;margin:7px 0;font-weight:600;transition:.2s}.cb:hover{background:var(--cac);color:var(--cbg);transform:translateY(-1px)}
.soc{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.soc a{border:1px solid var(--cac);color:var(--cac);border-radius:20px;padding:4px 12px;text-decoration:none;font-size:13px}
.sv{border-top:1px solid rgba(127,127,127,.3);padding:8px 0}.tp{display:inline-block;width:34px;height:34px;border-radius:10px;border:2px solid var(--bd);cursor:pointer;margin:3px}.tp.on{border-color:var(--gr)}
.qth{display:flex;flex-wrap:wrap;gap:8px}.qth>div{width:84px;border:2px solid var(--bd);border-radius:10px;padding:4px;cursor:pointer;font-size:11px;text-align:center}.qth>div.on{border-color:var(--gr)}.qth svg{width:100%;height:auto;display:block}
#t{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0B3D35;color:#F2EFE6;padding:10px 18px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:9}#t.on{opacity:1}
#pq{display:none}@media print{body>*:not(#pq){display:none!important}#pq{display:block;text-align:center}#pq svg{width:70%}}
@media(min-width:700px){.g4{grid-template-columns:repeat(4,1fr)}.ed{display:grid;grid-template-columns:1fr 380px;gap:16px}.pvw{position:sticky;top:8px;align-self:start}}
.card{position:relative;overflow:hidden}.card>*{position:relative;z-index:1}
.l1{text-align:center}.l1 .soc{justify-content:center}.l1 .av,.l1>img{display:block;margin-left:auto;margin-right:auto}
.l2,.l5,.l6,.l7,.l9,.l11{background:linear-gradient(150deg,var(--cbg),var(--cbg2))}
.l3{border-top:12px solid var(--cac);border-radius:10px}
.l4{border:2px solid var(--cac);border-radius:8px;box-shadow:none}.l4 .cb{border-radius:99px;background:transparent;border-color:var(--cac)}
.l5 .cb{background:rgba(255,255,255,.14);backdrop-filter:blur(8px);border-color:rgba(255,255,255,.3)}
.l6{box-shadow:inset 0 0 0 1px var(--cac),0 18px 40px -18px rgba(0,0,0,.55);border-radius:6px}.l6 h2{font-family:Georgia,serif;letter-spacing:.04em}.l6 .ro{text-transform:uppercase;letter-spacing:.14em;font-size:12px}.l6 .cb{border-radius:2px;background:transparent;border-color:var(--cac)}
.l7::before{content:"";position:absolute;top:-90px;right:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(var(--cac),transparent 65%);opacity:.45}
.l8::before{content:"";position:absolute;top:0;right:0;width:55%;height:120px;background:var(--cac);clip-path:polygon(35% 0,100% 0,100% 100%);opacity:.9}.l8 .cb{border-radius:4px}
.l9{background:var(--cbg)}.l9 h2{text-shadow:0 0 14px var(--cac)}.l9 .cb{border-color:var(--cac);box-shadow:0 0 12px -2px var(--cac)}.l9 .av{box-shadow:0 0 18px var(--cac)}
.l10::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--cac) 1.2px,transparent 1.4px);background-size:16px 16px;opacity:.16}
.l11{border-radius:2px;border-left:10px solid var(--cac)}.l11 .cb{border-radius:0;border-width:0 0 1px}
.mini{padding:9px;border-radius:12px;margin:0;max-width:none;box-shadow:none}.mini h2{font-size:11px;margin:4px 0 0}.mini .ro{font-size:8px}.mini .cb{padding:3px 6px;font-size:7px;margin:3px 0;border-radius:4px}.mini.sel{outline:3px solid var(--gr);outline-offset:2px}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin:8px 0}.tc{cursor:pointer;font-size:11px;color:var(--mu)}
</style></head><body><div id="app" class="wrap"></div><div id="t"></div><div id="pq"></div>
